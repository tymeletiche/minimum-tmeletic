# HW2: once a line overflows, backspaces cannot rescue it; the line is discarded
image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 3000000

[[inputs]]
at_tick = 600000
uart = 0
data = "echo xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\u0008\u0008\u0008\u0008\u0008\u0008\u0008\u0008\u0008\u0008\u0008\u0008\u0008\u0008\u0008\u0008\u0008\u0008\u0008\u0008\necho ok\n"

[assert]
uart0_contains = "msh> msh> ok\nmsh> "
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
