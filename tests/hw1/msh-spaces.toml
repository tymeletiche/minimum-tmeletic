# leading spaces ignored; repeated spaces collapse; trailing spaces dropped
image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 1000000

[[inputs]]
at_tick = 300000
uart = 0
data = "   echo  a   b  \n"

[assert]
uart0_contains = "hello world\nmsh> a b\nmsh> "
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
