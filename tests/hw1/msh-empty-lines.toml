# empty and all-space lines re-prompt without output
image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 1000000

[[inputs]]
at_tick = 300000
uart = 0
data = "\n     \n"

[assert]
uart0_contains = "hello world\nmsh> msh> msh> "
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
