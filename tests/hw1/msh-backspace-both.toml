# 0x08 and 0x7f both erase one byte
image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 1000000

[[inputs]]
at_tick = 300000
uart = 0
data = "echo abcX\u0008Y\u007fZ\n"

[assert]
uart0_contains = "hello world\nmsh> abcZ\nmsh> "
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
