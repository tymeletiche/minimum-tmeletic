# unknown command reports only its first word
image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 1000000

[[inputs]]
at_tick = 300000
uart = 0
data = "   mystery  arg\n"

[assert]
uart0_contains = "hello world\nmsh> command not found: mystery\nmsh> "
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
