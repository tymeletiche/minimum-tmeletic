# backspace on an empty line is ignored; the blank line just re-prompts
image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 1000000

[[inputs]]
at_tick = 300000
uart = 0
data = "\u0008\u007f\u0008\n"

[assert]
uart0_contains = "hello world\nmsh> msh> "
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
